apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge0
  labels:
    app: bridge0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge0
  template:
    metadata:
      labels:
        app: bridge0
    spec:
      containers:
        - name: bridge0
          image: python:3.11-slim
          command:
            [
              "sh",
              "-c",
              "pip install --quiet pika requests && python /app/bridge0.py",
            ]
          env:
            - name: AMQP_URL
              value: "amqp://guest:guest@lavinmq:5672/%2F"
            - name: TARGET_URL
              value: "http://istio-ingressgateway.istio-system.svc.cluster.local"
            - name: HOST_HEADER
              value: "app-baxtms5xdcqf8s2xxrlxg96il.application.127.0.0.1.sslip.io"
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: bridge0-code
